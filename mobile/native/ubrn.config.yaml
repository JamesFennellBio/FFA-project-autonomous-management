# uniffi-bindgen-react-native: builds mobile/core for iOS and Android and
# generates the TypeScript + C++ turbo module the app imports as "farmlab-hub-native".
#   npm run ubrn:android     (needs the Android NDK; see README.md)
#   npm run ubrn:ios         (macOS + Xcode only)
name: FarmlabHubNative
rust:
  directory: ../core
  manifestPath: Cargo.toml
android:
  directory: ./android
  targets: [arm64-v8a, armeabi-v7a, x86_64]
  apiLevel: 24
ios:
  directory: ./ios
  targets: [aarch64-apple-ios, aarch64-apple-ios-sim]
bindings:
  cpp: cpp/generated
  ts: src/generated
turboModule:
  cpp: cpp
  ts: src
