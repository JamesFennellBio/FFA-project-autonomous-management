name: CI + security scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch new RustSec advisories

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p hub-node --features lora -- -D warnings
      - run: cargo clippy -p crypto-sharecrate --features pq --all-targets -- -D warnings
      # Failing tests and their panic messages also become annotations, which
      # GitHub shows without signing in (job logs need a sign-in).
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          if ! { cargo test --workspace && cargo test -p crypto-sharecrate --features pq; } 2>&1 | tee test.log; then
            grep -E '^---- |panicked at|^test .* FAILED' test.log | head -40 | sed 's/^/::error title=cargo test::/'
            exit 1
          fi
      - name: crypto review index is up to date
        run: ./scripts/crypto-review.sh --check

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: data-node
      - name: build (Wi-Fi)
        working-directory: data-node
        env: { FARMLAB_WIFI_SSID: ci, FARMLAB_WIFI_PASSWORD: ci-password }
        run: cargo build --release
      - name: build (Wi-Fi + LoRa)
        working-directory: data-node
        env: { FARMLAB_WIFI_SSID: ci, FARMLAB_TRANSPORT: auto }
        run: cargo build --release --features lora

  audit:
    runs-on: ubuntu-latest
    # audit-check posts its findings as a check run, which needs checks: write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  # Type-checks the phone app. The Rust native module isn't built here (that
  # needs the Android NDK / Xcode); mobile/native/src/index.tsx declares its API.
  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
