name: CI + security scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch new RustSec advisories

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The Tauri app (app/src-tauri) links WebKitGTK on Linux.
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p farmlab-ui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p hub-node --features lora -- -D warnings
      - run: cargo clippy -p crypto-sharecrate --features pq --all-targets -- -D warnings
      # Failing tests and their panic messages also become annotations, which
      # GitHub shows without signing in (job logs need a sign-in).
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          if ! { cargo test --workspace && cargo test -p crypto-sharecrate --features pq; } 2>&1 | tee test.log; then
            grep -E '^---- |panicked at|^test .* FAILED' test.log | head -40 | sed 's/^/::error title=cargo test::/'
            exit 1
          fi
      - name: crypto review index is up to date
        run: ./scripts/crypto-review.sh --check

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: data-node
      - name: build (Wi-Fi)
        working-directory: data-node
        env: { FARMLAB_WIFI_SSID: ci, FARMLAB_WIFI_PASSWORD: ci-password }
        run: cargo build --release
      - name: build (Wi-Fi + LoRa)
        working-directory: data-node
        env: { FARMLAB_WIFI_SSID: ci, FARMLAB_TRANSPORT: auto }
        run: cargo build --release --features lora

  # The app UI (Leptos) builds to WASM with Trunk.
  app-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: trunk build --release
        working-directory: app/ui
        run: trunk build --release

  audit:
    runs-on: ubuntu-latest
    # audit-check posts its findings as a check run, which needs checks: write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Desktop installers: .deb / .rpm / AppImage, .msi / .exe, .dmg. Unsigned.
  app-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: cargo tauri build
        working-directory: app/src-tauri
        run: cargo tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: farmlab-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Debug-signed APK, installable for testing (a store build needs a release key).
  app-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner image already has the Android SDK and NDK.
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: cargo tauri android build
        working-directory: app/src-tauri
        run: |
          cargo tauri android init --ci
          cargo tauri android build --ci --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: farmlab-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # iOS simulator build: proves the app and its Swift plugins compile and link.
  # Device builds need a signing team (see app/README.md).
  app-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # Built from source so it's a native arm64 binary: the prebuilt one runs
      # under Rosetta, where the brew installs Tauri does (xcodegen,
      # libimobiledevice, ...) fail.
      - name: tauri-cli (arm64)
        run: cargo install tauri-cli --version "^2" --locked
      - name: cargo tauri ios build (simulator)
        working-directory: app/src-tauri
        run: |
          cargo tauri ios init --ci
          cargo tauri ios build --ci --debug --target aarch64-sim
