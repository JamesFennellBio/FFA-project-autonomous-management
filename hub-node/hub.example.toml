# Copy to /etc/farmlab-hub/hub.toml on the Raspberry Pi.

# identity.key, paired.json, pc_pairing.json and hub.db live here.
data_dir = "/var/lib/farmlab-hub"

# Wi-Fi nodes send UDP frames here (port must match crypto-sharecrate/src/radio.rs).
udp_listen = "0.0.0.0:7300"

# The phone app connects here over TCP (encrypted with the v2 hybrid protocol).
app_listen = "0.0.0.0:7302"

# Pairing with the PC: run `hub-node pair` and enter the code it prints in the
# desktop app (Pairing > Add hub). The hub learns the PC's address and key then.
# pair_listen = "0.0.0.0:7402"

# Optional: the PC's address, if it changes after pairing (give the PC a fixed IP
# with a DHCP reservation and you won't need this).
# pc_addr = "192.168.1.50:7400"

# Optional extra pin: only ever pair with this PC (its key ID from the app's
# Pairing page or pc-daemon's log).
# pc_key_id = "64-character-key-id"

# How often the RAM database is written to the SD card (seconds). Default: once a day.
flush_interval_secs = 86400

[lora]
# Set to true once the SX1262 is wired up AND the hub was built with --features lora.
enabled = false
spi_bus = 0
spi_cs = 0
# BCM GPIO numbers. NSS is fixed at GPIO25 (see hub-node/src/radio/lora.rs).
reset_pin = 22
busy_pin = 23
dio1_pin = 24
frequency = 915000000      # US. EU: 868100000
spreading_factor = 7       # must match the nodes
tcxo = false               # true for Ebyte E22 and other TCXO modules
