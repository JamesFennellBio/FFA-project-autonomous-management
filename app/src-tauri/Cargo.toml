[package]
name = "farmlab-app"
version.workspace = true
edition.workspace = true
description = "Farm & Lab desktop and phone app (Tauri shell around app/ui)"

[lib]
name = "farmlab_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
directories.workspace = true
hex.workspace = true
uplink = { path = "../../uplink" }
# The phone backend: v2 crypto + TCP link to the hub.
farmlab-mobile-core = { path = "../../mobile/core" }
# Plain HTTP to the daemon on 127.0.0.1 only, so no TLS.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Total RAM for the Lite / Normal hint. Desktop only: sysinfo doesn't build for iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
